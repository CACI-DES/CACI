name: Deploy Main to SmarterASP Production

on:
  push:
    branches:
      - main
      - master
      - Develop
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish and Deploy to SmarterASP via Web Deploy
        run: dotnet publish CACI_Life.csproj /p:PublishProfile=site10 /p:Password=${{ secrets.SMARTERASP_PASSWORD }}

      - name: Purge Cloudflare Edge Cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: powershell
        run: |
          if ($env:CF_TOKEN -and $env:CF_ZONE) {
            Write-Host "Purging Cloudflare edge cache..."
            $headers = @{
              "Authorization" = "Bearer $env:CF_TOKEN"
              "Content-Type"  = "application/json"
            }
            $body = '{"purge_everything":true}'
            
            Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/zones/$env:CF_ZONE/purge_cache" `
              -Method POST `
              -Headers $headers `
              -Body $body
            Write-Host "Cloudflare cache purged successfully."
          } else {
            Write-Host "Cloudflare secrets not present; skipping cache purge."
          }
